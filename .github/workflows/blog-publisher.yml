name: YGV Blog Publisher

on:
  schedule:
    # Monday 12:00 UTC (8:00 AM EDT) is the real run. Tue/Wed 15:00 UTC are fallbacks: GitHub
    # occasionally fails to start a hosted-runner job at all (2026-10-05: "job was not
    # acquired by Runner"), losing the whole week. publish.py skips these two when a post
    # already went out in the last 5 days, so they never double-publish.
    - cron: '0 12 * * 1'
    - cron: '0 15 * * 2,3'
  workflow_dispatch:   # manual trigger from GitHub Actions UI - always publishes

concurrency:
  group: blog-publisher
  cancel-in-progress: false   # never cancel a run mid-publish; queue the next one instead

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out sitemap repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic cryptography

      - name: Publish blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INDEXING_SA_KEY_JSON: ${{ secrets.INDEXING_SA_KEY_JSON }}
        run: python publisher/publish.py
